<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Elliya 가격">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Elliya Clinic — 시술 가격 정보</title>

<!--
═══════════════════════════════════════════════════════════
  ELLIYA CLINIC — 시술 가격 안내 (진료실 아이패드용)
───────────────────────────────────────────────────────────
  v1  2026.08.16  [최초 작성]
                  "Elliya 시술 관리" 구글시트의 Categories / Options
                  두 시트 내용을 그대로 내장(정적)한 단일 파일.
                  네트워크 없이 동작하므로 진료실 와이파이 상태와 무관.
  v2  2026.08.16  [카테고리 메뉴 세로 고정 — 버그 수정]
                  v1에 @media(max-width:780px)로 좁은 화면에서 사이드바를
                  상단 가로바로 전환하는 코드가 있었음. 아이패드 세로모드는
                  768px이라 이 조건에 걸려 메뉴가 가로로 변했음.
                  → 해당 코드 제거. 모든 화면에서 왼쪽 세로 메뉴 유지하고
                    폭·글자크기만 단계적으로 축소(820px / 560px).
  v3  2026.08.16  [확인 화면 보완]
                  · '총 예상 금액' → '총 금액'
                  · 확인 화면 버튼 2개: [다시 선택] [선택 확인]
                  · [선택 확인] 누르면 '확인 완료' 상태로 전환(확인 시각 표시).
                    코디네이터에게 그대로 보여줄 수 있는 화면.
                  · 확인 완료 후 [처음으로] → 선택 초기화 + 표지로 복귀.
                    다음 환자를 위한 리셋.
  v4  2026.08.16  [시트 자동 연동]
                  "Elliya 시술 관리" 시트에 묶인 별도 Apps Script(Price.gs)를
                  호출해 가격을 자동으로 가져옴. 예약 시스템(Code.gs)과 무관.

                  데이터 우선순위 3단계:
                   ① 시트에서 방금 받은 값      (정상)
                   ② 아이패드에 저장된 값        (와이파이 끊김)
                   ③ 파일 내장 기본값            (첫 실행 + 오프라인)

                  갱신 시점 = 표지 화면일 때만. 상담 도중에는 값이 바뀌지 않음.
                   · 앱 실행 시 1회
                   · [처음으로]로 표지 복귀 시 1회 (다음 환자부터 새 가격)

                  · JSONP 방식 — script.google.com은 다른 도메인이라 CORS 우회
                  · 조회 8초 내 응답 없으면 저장본으로 자동 폴백
                  · noindex 태그 — 검색엔진 색인 차단
                    (robots.txt에 파일명을 적으면 오히려 공개되므로 적지 않음)
                  · 로고 5연타 시 버전과 함께 '데이터 출처 + 갱신시각' 표시
  v5  2026.08.18  [홈 이동 추가 · 안내문구 삭제 · 버전 토글 위치 이동]
                  · 확인 화면의 '실제 결제 금액은 …' 안내 문구 삭제
                  · 왼쪽 상단 ELLIYA → 표지(홈) 화면으로 이동.
                    선택 내용은 유지되므로 실수로 눌러도 다시 터치하면 복귀.
                    선택을 비우려면 확인 화면의 [처음으로] 사용.
                  · 버전 표시를 로고 → 그 아래 '시술 가격 정보' 글자로 이동.
                    (로고가 홈 버튼이 되어 첫 탭에서 화면이 넘어가므로
                     5연타를 받을 수 없게 됨)
                  · 버전 토글 판정을 style.opacity → dataset.on 으로 변경.
                    CSS로 지정된 초기 opacity는 style.opacity가 빈 문자열이라
                    첫 비교가 항상 실패하던 문제 정리.

  ★ 가격/항목이 바뀌면 아래 DATA 블록만 수정하면 됩니다.
     (Categories 시트 = cats / Options 시트 = opts)
     수정 후 VER 값도 함께 올려주세요.
═══════════════════════════════════════════════════════════
-->

<style>
:root{
  --cream:#FDFCFA;
  --cream-mid:#F5F2EE;
  --gold:#B8965A;
  --gold-light:#DFC99A;
  --gold-dark:#8A6E3A;
  --ink:#1C1916;
  --ink-mid:#4A4440;
  --ink-light:#8A8480;
  --white:#FFFFFF;
  --border:rgba(184,150,90,0.18);
  --border-mid:rgba(184,150,90,0.32);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo',sans-serif;
  background:var(--cream);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}

/* ─── 표지 ─── */
#cover{
  position:fixed;inset:0;z-index:100;
  background:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
  transition:opacity .5s ease,visibility .5s;
}
#cover.gone{opacity:0;visibility:hidden;}
.cover-mark{
  font-family:'Cormorant Garamond','Playfair Display',Georgia,serif;
  font-size:clamp(2.6rem,7vw,4.6rem);
  letter-spacing:.22em;font-weight:300;color:var(--ink);
  text-indent:.22em;
  animation:rise .9s cubic-bezier(.2,.7,.3,1) both;
}
.cover-rule{
  width:64px;height:1px;background:var(--gold);
  margin:2.1rem 0 1.9rem;opacity:.65;
  animation:widen 1s cubic-bezier(.2,.7,.3,1) .25s both;
}
.cover-sub{
  font-size:clamp(.95rem,2.2vw,1.15rem);
  letter-spacing:.42em;color:var(--gold-dark);text-indent:.42em;
  font-weight:400;
  animation:rise .9s cubic-bezier(.2,.7,.3,1) .35s both;
}
.cover-foot{
  position:absolute;bottom:clamp(2.4rem,7vh,4.5rem);
  text-align:center;
  animation:rise .9s cubic-bezier(.2,.7,.3,1) .55s both;
}
.cover-doc{
  font-size:clamp(.9rem,2vw,1.05rem);
  letter-spacing:.2em;color:var(--ink-mid);text-indent:.2em;
}
.cover-hint{
  margin-top:1.5rem;font-size:.72rem;letter-spacing:.28em;
  color:var(--ink-light);text-indent:.28em;
  animation:breathe 2.8s ease-in-out 1.4s infinite;
}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes widen{from{opacity:0;width:0;}to{opacity:.65;width:64px;}}
@keyframes breathe{0%,100%{opacity:.35;}50%{opacity:.85;}}

/* ─── 본문 레이아웃 ─── */
#app{display:flex;height:100%;opacity:0;transition:opacity .5s ease .1s;}
#app.on{opacity:1;}

/* 사이드바 */
#side{
  width:clamp(180px,21vw,244px);flex-shrink:0;
  background:var(--cream-mid);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
.side-head{
  padding:1.6rem 1.4rem 1.1rem;
  border-bottom:1px solid var(--border);
}
.side-logo{
  display:block;width:100%;text-align:left;
  background:none;border:none;padding:0;cursor:pointer;color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.32rem;letter-spacing:.17em;font-weight:400;text-indent:.17em;
  transition:color .18s;
}
.side-logo:active{color:var(--gold-dark);}
.side-tag{cursor:default;}
.side-tag{
  font-size:.63rem;letter-spacing:.2em;color:var(--gold-dark);
  margin-top:.42rem;text-indent:.2em;
}
.side-list{flex:1;overflow-y:auto;padding:.7rem 0;-webkit-overflow-scrolling:touch;}
.cat{
  display:block;width:100%;text-align:left;
  padding:1.02rem 1.4rem;
  background:none;border:none;border-left:2px solid transparent;
  font-family:inherit;font-size:1.01rem;color:var(--ink-mid);
  letter-spacing:.01em;cursor:pointer;
  transition:color .18s,background .18s,border-color .18s;
}
.cat:hover{color:var(--ink);}
.cat.sel{
  color:var(--ink);font-weight:600;
  border-left-color:var(--gold);
  background:var(--white);
}
.cat-n{
  display:inline-block;width:1.5rem;
  font-size:.68rem;color:var(--gold);letter-spacing:.06em;
  vertical-align:.08em;
}
.cat.sel .cat-n{color:var(--gold-dark);}
.cat-badge{
  float:right;min-width:19px;height:19px;line-height:19px;
  border-radius:10px;background:var(--gold);color:var(--white);
  font-size:.65rem;text-align:center;padding:0 6px;
  margin-top:.14rem;display:none;
}
.cat.has .cat-badge{display:block;}

/* 본문 */
#main{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:env(safe-area-inset-top);}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2.1rem clamp(1.5rem,3.4vw,3rem) 1.6rem;}

.desc{
  padding:1.35rem 1.6rem;margin-bottom:1.9rem;
  background:var(--white);
  border:1px solid var(--border);
  border-left:2px solid var(--gold);
}
.desc-name{
  font-size:1.42rem;font-weight:600;letter-spacing:-.01em;
  margin-bottom:.6rem;
}
.desc-txt{
  font-size:.97rem;line-height:1.78;color:var(--ink-mid);
  word-break:keep-all;
}

.opt-label{
  font-size:.68rem;letter-spacing:.22em;color:var(--ink-light);
  text-indent:.22em;margin-bottom:.85rem;
}

.opt{
  display:flex;align-items:center;gap:1.05rem;
  width:100%;padding:1.16rem 1.35rem;margin-bottom:.62rem;
  background:var(--white);border:1px solid var(--border);
  cursor:pointer;text-align:left;font-family:inherit;
  transition:border-color .18s,background .18s;
}
.opt:active{background:var(--cream-mid);}
.opt.on{border-color:var(--gold);background:#FEFCF7;}

.box{
  width:25px;height:25px;flex-shrink:0;
  border:1.5px solid var(--border-mid);border-radius:3px;
  background:var(--white);
  display:flex;align-items:center;justify-content:center;
  transition:background .18s,border-color .18s;
}
.opt.on .box{background:var(--gold);border-color:var(--gold);}
.box svg{width:14px;height:14px;opacity:0;transition:opacity .18s;}
.opt.on .box svg{opacity:1;}

.opt-name{flex:1;font-size:1.06rem;color:var(--ink);min-width:0;word-break:keep-all;}
.opt-price{
  font-size:1.12rem;font-weight:600;color:var(--ink);
  letter-spacing:-.015em;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.opt.on .opt-price{color:var(--gold-dark);}

/* 하단 합계 */
#bar{
  flex-shrink:0;
  border-top:1px solid var(--border);
  background:var(--white);
  padding:1.05rem clamp(1.5rem,3.4vw,3rem);
  padding-bottom:calc(1.05rem + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:1.5rem;
}
.sum-wrap{flex:1;min-width:0;}
.sum-label{font-size:.68rem;letter-spacing:.2em;color:var(--ink-light);text-indent:.2em;}
.sum-line{display:flex;align-items:baseline;gap:.6rem;margin-top:.22rem;}
.sum-cnt{font-size:.83rem;color:var(--gold-dark);white-space:nowrap;}
.sum-val{
  font-size:clamp(1.5rem,3.4vw,1.95rem);font-weight:700;
  letter-spacing:-.025em;font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.sum-won{font-size:.95rem;font-weight:400;color:var(--ink-mid);margin-left:.1rem;}

.btn{
  flex-shrink:0;padding:1.02rem 2.5rem;
  background:var(--ink);color:var(--cream);
  border:none;font-family:inherit;font-size:1.01rem;
  letter-spacing:.1em;text-indent:.1em;cursor:pointer;
  transition:opacity .2s,background .2s;
}
.btn:disabled{background:var(--cream-mid);color:var(--ink-light);cursor:default;}
.btn:not(:disabled):active{background:var(--gold-dark);}

/* ─── 확인 화면 ─── */
#sheet{
  position:fixed;inset:0;z-index:90;
  background:rgba(28,25,22,.42);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(1.2rem,4vw,3rem);
  opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;
}
#sheet.on{opacity:1;visibility:visible;}
.card{
  background:var(--cream);width:100%;max-width:620px;
  max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(16px);transition:transform .3s cubic-bezier(.2,.7,.3,1);
}
#sheet.on .card{transform:none;}
.card-head{
  padding:1.8rem 2rem 1.3rem;border-bottom:1px solid var(--border);
}
.card-title{font-size:1.28rem;font-weight:600;}
.card-sub{font-size:.78rem;color:var(--ink-light);margin-top:.34rem;letter-spacing:.02em;}
.card-body{flex:1;overflow-y:auto;padding:1.5rem 2rem;-webkit-overflow-scrolling:touch;}
.sum-cat{
  font-size:.68rem;letter-spacing:.18em;color:var(--gold-dark);
  text-indent:.18em;margin:1.2rem 0 .6rem;
}
.sum-cat:first-child{margin-top:0;}
.sum-row{
  display:flex;justify-content:space-between;gap:1.2rem;
  padding:.66rem 0;border-bottom:1px solid var(--border);
  font-size:.99rem;
}
.sum-row span:last-child{
  font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;
}
.card-total{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:1.35rem 2rem;border-top:1px solid var(--border-mid);
  background:var(--white);
}
.card-total-l{font-size:.95rem;letter-spacing:.04em;}
.card-total-v{
  font-size:1.72rem;font-weight:700;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;
}
.card-foot{padding:1.1rem 2rem;padding-bottom:calc(1.1rem + env(safe-area-inset-bottom));display:flex;gap:.8rem;}
.btn-ghost{
  flex:1;padding:1rem;background:none;border:1px solid var(--border-mid);
  font-family:inherit;font-size:.98rem;color:var(--ink-mid);cursor:pointer;
  letter-spacing:.06em;
}
.btn-ghost:active{background:var(--cream-mid);}
.btn-fill{
  flex:1;padding:1rem;background:var(--ink);border:1px solid var(--ink);
  font-family:inherit;font-size:.98rem;color:var(--cream);cursor:pointer;
  letter-spacing:.06em;
}
.btn-fill:active{background:var(--gold-dark);border-color:var(--gold-dark);}
.confirmed{
  display:flex;align-items:center;gap:.55rem;
  font-size:.9rem;color:var(--gold-dark);letter-spacing:.04em;
}
.note{
  font-size:.76rem;color:var(--ink-light);line-height:1.7;
  padding:1rem 2rem 0;word-break:keep-all;
}

#ver{
  position:fixed;right:6px;bottom:2px;z-index:120;
  font-size:.54rem;color:var(--ink-light);opacity:0;
  letter-spacing:.05em;pointer-events:none;
}

/* 좁은 화면 — 메뉴는 항상 왼쪽 세로 유지, 폭만 줄임 */
@media (max-width:820px){
  #side{width:clamp(148px,26vw,190px);}
  .side-head{padding:1.25rem 1rem .9rem;}
  .side-logo{font-size:1.15rem;}
  .cat{padding:.94rem 1rem;font-size:.95rem;}
  #scroll{padding:1.6rem 1.3rem 1.3rem;}
  .desc{padding:1.15rem 1.25rem;margin-bottom:1.5rem;}
  .opt{padding:1.05rem 1.1rem;gap:.85rem;}
  .opt-name{font-size:1rem;}
  .opt-price{font-size:1.04rem;}
  #bar{padding:.95rem 1.3rem;padding-bottom:calc(.95rem + env(safe-area-inset-bottom));gap:1rem;}
  .btn{padding:.95rem 1.7rem;}
}
@media (max-width:560px){
  #side{width:clamp(116px,32vw,148px);}
  .cat{padding:.86rem .8rem;font-size:.88rem;}
  .cat-n{width:1.25rem;font-size:.62rem;}
  .cat-badge{float:none;display:none!important;}
  .opt{flex-wrap:wrap;}
  .opt-price{width:100%;padding-left:2.5rem;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>

<!-- ═══ 표지 ═══ -->
<div id="cover">
  <div class="cover-mark">ELLIYA</div>
  <div class="cover-rule"></div>
  <div class="cover-sub">시술 가격 정보</div>
  <div class="cover-foot">
    <div class="cover-doc">홍준택 대표원장</div>
    <div class="cover-hint">화면을 터치하세요</div>
  </div>
</div>

<!-- ═══ 본문 ═══ -->
<div id="app">
  <aside id="side">
    <div class="side-head">
      <button class="side-logo" id="home" title="처음 화면으로">ELLIYA</button>
      <div class="side-tag" id="tag">시술 가격 정보</div>
    </div>
    <div class="side-list" id="cats"></div>
  </aside>

  <div id="main">
    <div id="scroll"></div>
    <div id="bar">
      <div class="sum-wrap">
        <div class="sum-label">선택 합계</div>
        <div class="sum-line">
          <span class="sum-cnt" id="cnt"></span>
          <span class="sum-val" id="sum">0<span class="sum-won">원</span></span>
        </div>
      </div>
      <button class="btn" id="go" disabled>확인</button>
    </div>
  </div>
</div>

<!-- ═══ 확인 ═══ -->
<div id="sheet">
  <div class="card">
    <div class="card-head">
      <div class="card-title">선택하신 시술</div>
      <div class="card-sub" id="today"></div>
    </div>
    <div class="card-body" id="detail"></div>
    <div class="card-total">
      <span class="card-total-l">총 금액</span>
      <span class="card-total-v" id="total">0원</span>
    </div>
    <div class="card-foot" id="foot">
      <button class="btn-ghost" id="back">다시 선택</button>
      <button class="btn-fill" id="ok">선택 확인</button>
    </div>
  </div>
</div>

<div id="ver"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   DATA — "Elliya 시술 관리" 구글시트 내용
   ───────────────────────────────────────────────────────────
   ★ 시트가 바뀌면 이 두 배열만 고치면 됩니다.

   cats : Categories 시트 [순번, 카테고리명, 설명]
   opts : Options 시트    [카테고리순번, 옵션순번, 옵션명, 가격]
   ═══════════════════════════════════════════════════════════ */
var VER = 'v5 · 2026.08.18';

/* 시술 가격 API — "Elliya 시술 관리" 시트에 묶인 별도 Apps Script 배포 */
var API = 'https://script.google.com/macros/s/AKfycbzjOhnSgccKuCnB_aygeJ1j9zihYYNwgPlzuwZhW57QCKNOp1fKt48SGkSLGxyd2ci1Xg/exec';
var CACHE_KEY = 'elliya_price_v1';

/* ↓ 아래는 "첫 실행인데 인터넷이 없을 때"만 쓰이는 비상용 기본값입니다.
     평소에는 시트에서 받아온 값으로 자동 대체되므로 손대지 않아도 됩니다. */
var cats = [
  { n:1, name:'소프웨이브',      desc:'SUPERB™ 초음파 기술을 사용하여 피부 진피 약 1.5mm에 초음파 에너지를 균일하게 전달하는 리프팅' },
  { n:2, name:'온다리프팅',      desc:'극초단파 기술 및 핸드피스를 이용한 스킨 리프팅과 지속적인 콜라겐 리모델링 효과로 건강한 피부 타이트닝 가능' },
  { n:3, name:'티타늄 리프팅',   desc:'3가지 파장을 동시에 조사해 미백+탄력을 함께 챙기는 4세대 리프팅 기기' },
  { n:4, name:'울쎄라피 프라임', desc:'정밀하고 깊은 층까지 닿는 초음파로 더욱 개선된 리프팅효과를 제공' }
];

var opts = [
  { c:1, n:1, name:'소프웨이브 200샷',        price:1700000 },
  { c:1, n:2, name:'소프웨이브 300샷',        price:2400000 },
  { c:1, n:3, name:'소프웨이브 100샷',        price: 990000 },

  { c:2, n:1, name:'온다 페이스 30kJ',        price: 279000 },
  { c:2, n:2, name:'온다 페이스 60kJ',        price: 499000 },
  { c:2, n:3, name:'온다 페이스 100kJ',       price: 690000 },
  { c:2, n:4, name:'온다 바디 400kJ',         price:2890000 },

  { c:3, n:1, name:'티타늄 리프팅 20kJ',      price: 350000 },
  { c:3, n:2, name:'티타늄 리프팅 60kJ',      price: 850000 },
  { c:3, n:3, name:'티타늄 리프팅 80kJ',      price:1050000 },
  /* ⚠️ 아래 3개는 시트 화면에서 이름이 잘려 보여 확인이 필요합니다.
        시트의 전체 옵션명으로 고쳐주세요. 가격은 시트값 그대로입니다. */
  { c:3, n:4, name:'티타늄 20kJ + 더마슈링크', price: 500000 },
  { c:3, n:5, name:'티타늄 60kJ + 울쎄라피 프라임', price:1590000 },
  { c:3, n:6, name:'티타늄 60kJ + 울쎄라피 프라임', price:3890000 },

  { c:4, n:1, name:'울쎄라피 프라임 100샷',   price: 400000 },
  { c:4, n:2, name:'울쎄라피 프라임 300샷',   price:1050000 }
];

/* ═══════════════════════════════════════════════════════════ */

var sel = {};      // { "카테고리순번-옵션순번": true }
var cur = cats[0] ? cats[0].n : 1;

/* ═══════════════════════════════════════════════════════════
   데이터 갱신 — 3단계 안전망
   ① 시트에서 방금 받은 값   (정상)
   ② 아이패드에 저장된 값     (와이파이 끊김)
   ③ 파일 내장 기본값         (첫 실행 + 오프라인)

   갱신 시점은 "표지 화면"일 때만. 상담 도중에는 절대 바뀌지 않음.
   ═══════════════════════════════════════════════════════════ */
var srcInfo = '내장값';   // 현재 쓰고 있는 데이터의 출처(버전 배지에 표시)

function saveCache(res){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      cats: res.cats, opts: res.opts, updated: res.updated, at: Date.now()
    }));
  }catch(err){ /* 저장 불가 환경이어도 동작에는 지장 없음 */ }
}

function loadCache(){
  try{
    var raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    var c = JSON.parse(raw);
    if (!c || !c.cats || !c.cats.length) return false;
    cats = c.cats; opts = c.opts;
    srcInfo = '저장본 ' + (c.updated || '');
    return true;
  }catch(err){ return false; }
}

/* 시트 조회 (JSONP — 다른 도메인이라 script 태그 방식 사용) */
function fetchSheet(done){
  var cb = 'ep' + Date.now();
  var s  = document.createElement('script');
  var fin = false;

  function cleanup(){
    try{ delete window[cb]; }catch(err){ window[cb] = null; }
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  function end(ok){
    if (fin) return;
    fin = true; clearTimeout(timer); cleanup();
    if (done) done(ok);
  }

  var timer = setTimeout(function(){ end(false); }, 8000);

  window[cb] = function(res){
    if (res && res.ok && res.cats && res.cats.length){
      cats = res.cats;
      opts = res.opts || [];
      srcInfo = '시트 ' + (res.updated || '');
      saveCache(res);
      if (!cats.some(function(c){ return c.n === cur; })) cur = cats[0].n;
      end(true);
    } else {
      end(false);
    }
  };

  s.onerror = function(){ end(false); };
  s.src = API + '?callback=' + cb + '&t=' + Date.now();
  document.head.appendChild(s);
}

/* 표지에 있는 동안 갱신 시도 */
function refresh(){
  fetchSheet(function(ok){
    if (ok) draw();          // 성공 시 화면 데이터 교체
  });
}

function won(v){ return v.toLocaleString('ko-KR'); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

/* 사이드바 */
function drawCats(){
  var h = '';
  cats.forEach(function(c){
    var cnt = opts.filter(function(o){
      return o.c === c.n && sel[o.c + '-' + o.n];
    }).length;
    h += '<button class="cat' + (c.n === cur ? ' sel' : '') + (cnt ? ' has' : '') +
         '" data-c="' + c.n + '">' +
         '<span class="cat-n">' + String(c.n).padStart(2,'0') + '</span>' +
         esc(c.name) +
         '<span class="cat-badge">' + cnt + '</span></button>';
  });
  document.getElementById('cats').innerHTML = h;
}

/* 본문 */
function drawMain(){
  var c = cats.filter(function(x){ return x.n === cur; })[0];
  if (!c) return;

  var h = '<div class="desc">' +
          '<div class="desc-name">' + esc(c.name) + '</div>' +
          '<div class="desc-txt">' + esc(c.desc) + '</div></div>';

  var list = opts.filter(function(o){ return o.c === cur; });
  if (list.length){
    h += '<div class="opt-label">시술 옵션</div>';
    list.forEach(function(o){
      var k = o.c + '-' + o.n;
      h += '<button class="opt' + (sel[k] ? ' on' : '') + '" data-k="' + k + '">' +
           '<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" ' +
           'stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">' +
           '<polyline points="20 6 9 17 4 12"/></svg></span>' +
           '<span class="opt-name">' + esc(o.name) + '</span>' +
           '<span class="opt-price">' + won(o.price) + '원</span></button>';
    });
  }

  var s = document.getElementById('scroll');
  s.innerHTML = h;
  s.scrollTop = 0;
}

/* 합계 */
function drawSum(){
  var list = opts.filter(function(o){ return sel[o.c + '-' + o.n]; });
  var t = list.reduce(function(a,o){ return a + o.price; }, 0);

  document.getElementById('sum').innerHTML = won(t) + '<span class="sum-won">원</span>';
  document.getElementById('cnt').textContent = list.length ? list.length + '개 선택' : '';
  document.getElementById('go').disabled = !list.length;
}

function draw(){ drawCats(); drawMain(); drawSum(); }

/* 이벤트 */
document.getElementById('cats').addEventListener('click', function(e){
  var b = e.target.closest('.cat');
  if (!b) return;
  cur = parseInt(b.dataset.c, 10);
  drawCats(); drawMain();
});

document.getElementById('scroll').addEventListener('click', function(e){
  var b = e.target.closest('.opt');
  if (!b) return;
  var k = b.dataset.k;
  if (sel[k]) { delete sel[k]; } else { sel[k] = true; }
  b.classList.toggle('on');
  drawCats(); drawSum();
});

/* 확인 화면 */
document.getElementById('go').addEventListener('click', function(){
  var h = '', t = 0;
  cats.forEach(function(c){
    var list = opts.filter(function(o){ return o.c === c.n && sel[o.c + '-' + o.n]; });
    if (!list.length) return;
    h += '<div class="sum-cat">' + esc(c.name) + '</div>';
    list.forEach(function(o){
      t += o.price;
      h += '<div class="sum-row"><span>' + esc(o.name) + '</span>' +
           '<span>' + won(o.price) + '원</span></div>';
    });
  });

  var d = new Date();
  document.getElementById('today').textContent =
    d.getFullYear() + '. ' + (d.getMonth()+1) + '. ' + d.getDate();
  document.getElementById('detail').innerHTML = h;
  document.getElementById('total').textContent = won(t) + '원';

  // 카드 상태 초기화(확인 전)
  document.querySelector('.card-title').textContent = '선택하신 시술';
  document.getElementById('foot').innerHTML =
    '<button class="btn-ghost" id="back">다시 선택</button>' +
    '<button class="btn-fill" id="ok">선택 확인</button>';

  document.getElementById('sheet').classList.add('on');
});

/* 카드 하단 버튼 (다시 선택 / 선택 확인 / 처음으로) */
document.getElementById('foot').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b) return;

  if (b.id === 'back'){
    document.getElementById('sheet').classList.remove('on');

  } else if (b.id === 'ok'){
    // 확인 완료 — 코디네이터에게 보여주는 상태
    var d = new Date();
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    document.querySelector('.card-title').textContent = '확인 완료';
    document.getElementById('today').textContent =
      d.getFullYear() + '. ' + (d.getMonth()+1) + '. ' + d.getDate() + '  ' + hh + ':' + mm;
    this.innerHTML =
      '<span class="confirmed">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<polyline points="20 6 9 17 4 12"/></svg>확인되었습니다</span>' +
      '<button class="btn-ghost" id="reset" style="flex:0 0 auto;padding:1rem 1.6rem;">처음으로</button>';
    this.style.alignItems = 'center';
    this.style.justifyContent = 'space-between';

  } else if (b.id === 'reset'){
    // 다음 환자를 위해 전체 초기화
    sel = {};
    cur = cats[0] ? cats[0].n : 1;
    this.style.alignItems = '';
    this.style.justifyContent = '';
    document.getElementById('sheet').classList.remove('on');
    document.getElementById('cover').classList.remove('gone');
    document.getElementById('app').classList.remove('on');
    draw();
    refresh();   // 다음 환자 — 표지로 돌아온 김에 최신 가격 재조회
  }
});
document.getElementById('sheet').addEventListener('click', function(e){
  if (e.target === this) this.classList.remove('on');
});

/* 표지 → 본문 */
function open(){
  document.getElementById('cover').classList.add('gone');
  document.getElementById('app').classList.add('on');
}
document.getElementById('cover').addEventListener('click', open);
document.getElementById('cover').addEventListener('touchstart', function(e){
  e.preventDefault(); open();
}, {passive:false});

/* 왼쪽 상단 ELLIYA — 표지(홈) 화면으로.
   선택 내용은 그대로 유지되므로, 상담 중 실수로 눌러도 다시 터치하면 복귀됨.
   선택을 비우려면 확인 화면의 [처음으로]를 사용. */
document.getElementById('home').addEventListener('click', function(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('cover').classList.remove('gone');
  document.getElementById('app').classList.remove('on');
  refresh();   // 표지로 돌아온 김에 최신 가격 재조회
});

/* 버전 확인 — 로고 아래 '시술 가격 정보' 글자를 3초 내 5연타.
   (로고는 홈 버튼이 되었으므로 5연타를 받을 수 없어 부제로 옮김) */
var taps = [];
document.getElementById('tag').addEventListener('click', function(){
  var now = Date.now();
  taps.push(now);
  taps = taps.filter(function(t){ return now - t <= 3000; });
  if (taps.length >= 5){
    taps = [];
    var v = document.getElementById('ver');
    if (v.dataset.on === '1'){
      v.dataset.on = '0'; v.style.opacity = '0';
    } else {
      v.dataset.on = '1';
      v.textContent = VER + '  ·  ' + srcInfo;
      v.style.opacity = '1';
    }
  }
});

/* ── 시작 ──
   ① 저장본이 있으면 즉시 반영 (빠른 표시)
   ② 동시에 시트 조회 — 표지를 보는 동안 백그라운드로 진행 */
loadCache();
draw();
refresh();
</script>
